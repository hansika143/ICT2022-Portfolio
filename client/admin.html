<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | John Peter Portfolio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- =========================================================
       NAVBAR
       Standalone admin page keeps the same nav, pointing back
       to the other pages as plain links (not a SPA toggle).
  ========================================================== -->
  <header class="navbar">
    <nav class="nav-pill">
      <span class="nav-brand">Portfolio</span>
      <a href="home.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="projects.html" class="nav-link">Projects</a>
      <a href="admin.html" class="nav-link active">Admin</a>
    </nav>
  </header>

  <main class="page-wrapper">

    <!-- =========================================================
         INTERFACE 4 - ADMIN PAGE
         Add / Update form + list of existing projects with
         Edit / Delete controls
    ========================================================== -->
    <section id="admin" class="page active">

      <div class="card admin-form-card">
        <h2 class="card-title" id="admin-form-title">Add / Update Project</h2>

        <form id="project-form">
          <!-- Hidden field stores the _id of the project being edited (empty = "create" mode) -->
          <input type="hidden" id="project-id" value="" />

          <label class="form-label" for="project-title">Project Title</label>
          <input
            type="text"
            id="project-title"
            class="form-input"
            placeholder="Project title"
            required
          />

          <label class="form-label" for="project-description">Description</label>
          <textarea
            id="project-description"
            class="form-textarea"
            placeholder="Short project description"
            rows="3"
            required
          ></textarea>

          <label class="form-label" for="project-technologies">Technologies (comma separated)</label>
          <input
            type="text"
            id="project-technologies"
            class="form-input"
            placeholder="React, MongoDB, Express"
            required
          />

          <label class="form-label" for="project-link">Project Link</label>
          <input
            type="url"
            id="project-link"
            class="form-input"
            placeholder="https://github.com/username/project"
          />

          <div class="form-actions">
            <button type="submit" id="save-btn" class="btn btn-primary">Save Project</button>
            <button type="button" id="reset-btn" class="btn btn-secondary">Reset</button>
          </div>

          <p id="form-status" class="form-status" hidden></p>
        </form>
      </div>

      <div class="card admin-list-card">
        <h3 class="card-subtitle">Projects</h3>
        <div id="admin-projects-list">
          <!-- Existing projects rendered here by renderAdminList() in admin.js -->
        </div>
        <p class="empty-state" id="admin-empty" hidden>No projects in the database yet.</p>
      </div>

    </section>

  </main>

  <script src="admin.js"></script>
</body>
